name: notify

on:
  schedule:
    # 毎時 0 分は GitHub 全体の高負荷帯で、schedule イベントが遅延・欠落しやすい
    # （公式ドキュメント記載）。混雑を避けて毎時 23 分に実行する。
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discord 投稿をスキップして動作確認だけ行う"
        required: false
        default: "false"

concurrency:
  group: notify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    # 実処理は十数秒の軽量ジョブのため 1 vCPU の ubuntu-slim で十分
    # （git / Python 3.12 / Node 24 はプリインストール済み。ジョブ上限は 15 分）
    runs-on: ubuntu-slim
    timeout-minutes: 10
    defaults:
      run:
        # リリース通知はサブプロジェクト配下で実行する
        working-directory: claude-code-release-notifier
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "claude-code-release-notifier/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run notifier
        env:
          GITHUB_PAT: ${{ secrets.CC_GITHUB_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: uv run python -m notifier.main

      - name: Commit state changes
        run: |
          set -euo pipefail
          if git diff --quiet -- state.json; then
            echo "state.json に変更なし"
            exit 0
          fi
          tag=$(python -c 'import json; print(json.load(open("state.json")).get("last_tag_name") or "unknown")')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore(state): update last_release_id to ${tag}"
          git push
