name: notify

on:
  schedule:
    # 毎時 0 分は GitHub 全体の高負荷帯で、schedule イベントが遅延・欠落しやすい
    # （公式ドキュメント記載）。混雑を避けて毎時 23 分に実行する。
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discord 投稿をスキップして動作確認だけ行う"
        required: false
        default: "false"
      preview:
        description: "既読に関係なく最新リリースを 1 件処理する（state.json は更新しない）"
        required: false
        default: "false"

concurrency:
  group: notify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    # 実処理は十数秒の軽量ジョブのため 1 vCPU の ubuntu-slim で十分
    # （git / Python 3.12 / Node 24 はプリインストール済み。ジョブ上限は 15 分）
    runs-on: ubuntu-slim
    timeout-minutes: 10
    defaults:
      run:
        # リリース通知はサブプロジェクト配下で実行する
        working-directory: claude-code-release-notifier
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          cache-dependency-glob: "claude-code-release-notifier/uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run notifier
        env:
          GITHUB_PAT: ${{ secrets.CC_GITHUB_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PREVIEW: ${{ github.event.inputs.preview || 'false' }}
        run: uv run python -m notifier.main

      # 複数リリースのうち途中で失敗しても、配信済みリリースの state は保存する（二重投稿を防ぐ）
      - name: Commit state changes
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if git diff --quiet -- state.json; then
            echo "state.json に変更なし"
            exit 0
          fi
          tag=$(python -c 'import json; print(json.load(open("state.json")).get("last_tag_name") or "unknown")')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore(state): update last_release_id to ${tag}"
          # articles ワークフローも同じリポジトリへ push するため、先を越されたら取り込み直して再試行
          for attempt in 1 2 3; do
            git pull --rebase --quiet
            if git push --quiet; then
              exit 0
            fi
            echo "push に失敗 (attempt ${attempt})。取り込み直して再試行"
            sleep $((attempt * 5))
          done
          echo "push に 3 回失敗した"
          exit 1
